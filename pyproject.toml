[project]
name = "pos-signature-parsing"
version = "0.1.0"
description = "Offline reproduction and implementation of POS-signature demonstration retrieval for dependency parsing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "Pillow==12.3.0",
]

# Optional tools for new model calls; never installed by the reproduction setup.
[project.optional-dependencies]
inference = [
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "pandas>=2,<3",
    "stanza>=1.11,<2",
    "sentence-transformers>=3,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pydantic>=2,<3",
    "matplotlib>=3.8,<4",
]

[tool.uv]
package = false
default-groups = []
required-version = ">=0.12.5"
